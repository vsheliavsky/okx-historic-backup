[project]
name = "okx-historic-backup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=22.0.0",
    "python-okx>=0.4.0",
    "tenacity>=9.1.2",
]

[project.scripts]
okx-backup = "okx_historic_backup.main:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

# --- Ruff Configuration ---
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W: Errors/Warnings, F: Pyflakes, I: Isort, B: Bugbear, UP: Pyupgrade
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Ty / Pyright Configuration ---
[tool.pyright]
include = ["src", "okx_historic_loader"] # Update to match your folder name
typeCheckingMode = "standard" # Options: "off", "basic", "standard", "strict"
pythonVersion = "3.14"
reportMissingImports = true
reportMissingTypeStubs = false
