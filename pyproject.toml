[project]
name = "okx-historic-backup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=22.0.0",
    "python-okx>=0.4.0",
    "tenacity>=9.1.2",
]

[project.scripts]
okx-backup = "okx_historic_backup.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
]

# --- Ruff Configuration ---
[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/W: Errors/Warnings, F: Pyflakes, I: Isort, B: Bugbear, UP: Pyupgrade
select = ["E", "F", "I", "B", "UP", "N"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Ty / Pyright Configuration ---
[tool.pyright]
include = ["src", "okx_historic_loader"] # Update to match your folder name
typeCheckingMode = "standard" # Options: "off", "basic", "standard", "strict"
pythonVersion = "3.14"
reportMissingImports = true
reportMissingTypeStubs = false

# --- Pytest Configuration ---
[tool.pytest.ini_options]
# Specifies where pytest should look for tests by default
testpaths = ["tests"]

# Ensures pytest can find your source code without manual PYTHONPATH hacks
# Added "src" assuming a standard src-layout, or "." if your package is in the root
pythonpath = ["src"]

# Standard options: 
# -ra: show extra test summary info for all except passed
# --strict-markers: raise error on unregistered markers
# --import-mode=importlib: the modern, recommended import mechanism
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]

# Configure logging for tests if needed
log_cli = false
log_cli_level = "INFO"
